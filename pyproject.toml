[tool.poetry]
name = "earthquake-prediction"
version = "0.1.0"
description = "Earthquake analysis and prediction workflows for Turkey"
authors = ["Dicle Bulut"]
readme = "README.md"
packages = [{ include = "modules" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pandas = "2.3.3"
numpy = "2.3.5"
scipy = "1.16.3"
matplotlib = "3.10.7"
requests = "2.32.5"
folium = "0.20.0"
branca = "0.8.2"
geojson = "3.2.0"
tabulate = "0.9.0"
ipywidgets = "8.1.8"
ipykernel = "7.1.0"
ipython = "9.7.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
